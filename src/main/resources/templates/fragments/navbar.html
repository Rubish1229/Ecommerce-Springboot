<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Customer Signup</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/css/customerSignup.css">
    <link rel="stylesheet" href="/css/anonymous.css">
<style>
    .custom-search {
        width: 700px;
        height: 20px;
        padding: 5px;
        border-radius: 5px;
    }
    .icon{
        height: 20px;
        width: 30px;
    }
    .btns a button{
        height: 20px;
        width: 50px;
        padding: 5px;
    }

    .vertical-line{
        height: 20px;
        width: 25px;
        color: white;
    }


</style>
</head>
<body>
    <nav th:fragment="navbar"
         class="navbar navbar-expand-lg navbar-dark"
         style="background-color: #000000;">
    <div class="container-fluid custom-logo">
        <a href="#"><img src="https://www.shutterstock.com/image-vector/amazon-logo-editorial-icon-isolated-600nw-2333488123.jpg" style="height: 70px; width: 100px;"></a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">





            <form class="custom-search" role="search" style="margin-left: 70px;">
                <input type="search" placeholder="Search" aria-label="Search" style="width: 700px; height: 40px;" />
                <button class="search-btn" type="submit" style="width: 100px; height: 45px;">Search</button>
            </form>


    </div>
    </div>
        <div class="cart">
            <img src="/images/cart.png" class="cart-img" alt="cart-img" style="width: 100px; height: 50px;">
        </div>

        <div class="btns">
            <a href="/navbar/signup">

                <button type="button" class="btn btn-light">Signup</button>

                </a>
        </div>
        <div class="vertical-line"> | </div>
        <div class="vertical-line"> | </div>
        <div class="btns">
            <a href="/navbar/login">
                <button type="button" class="btn btn-light" style="margin-right: 10px;">Login</button>
            </a>
        </div>
</nav>







</body>
</html>
