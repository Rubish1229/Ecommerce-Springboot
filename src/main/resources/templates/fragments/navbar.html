<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Customer Signup</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/css/customerSignup.css">
    <link rel="stylesheet" href="/css/anonymous.css">
<style>
    .custom-search {
        width: 700px;
        height: 20px;
        padding: 5px;
        border-radius: 5px;

    }
    .icon{
        height: 20px;
        width: 30px;
    }
    .btns a button{
        height: 20px;
        width: 50px;
        padding: 5px;

    }

    .vertical-line{
        height: 20px;
        width: 25px;
        color: white;
    }

    .history{
        display: flex;
        align-items: center;

    }




</style>
</head>
<body>
    <nav th:fragment="navbar"
         class="navbar navbar-expand-lg navbar-dark"
         style="background-color: #000000;">
    <div class="container-fluid custom-logo">
        <a href="/anonymous/home"><img src="https://www.shutterstock.com/image-vector/amazon-logo-editorial-icon-isolated-600nw-2333488123.jpg" style="height: 70px; width: 100px;"></a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">





            <form class="custom-search" role="search" style="margin-left: 250px; margin-top: 10px;">
                <input type="search" placeholder="Search" aria-label="Search" style="width: 700px; height: 45px;  border-radius: 5px; padding-left: 7px;" />
                <button class="search-btn" type="submit" style="width: 100px; height: 45px; background-color: #FF9900; border-radius: 7px;" >Search</button>
            </form>


    </div>
    </div>

        <div class="history"> <a th:href="@{/customer/history}" style="margin-right: 5px; text-decoration: none; color: white;"><i class="fa-solid fa-user"></i> <b>History</b></a></div>

        <div class="cart" style="margin-right: 5px;">
           <a th:href="@{/customer/cart}"> <img src="/images/cart.png" class="cart-img" alt="cart-img" style="width: 100px; height: 50px;" ></a>
        </div>



        <div class="vertical-line"> | </div>
        <div class="vertical-line"> | </div>
        <div class="btns" style="margin-right: 10px;">
            <a href="/navbar/login">
                <button type="button" class="btn btn-light" style="margin-right: 10px; background-color: #B12704; color:white; border: none;">Logout</button>
            </a>
        </div>
</nav>







</body>
</html>
