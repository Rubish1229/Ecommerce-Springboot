<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Add Category</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body{
            height: 100vh;
            display: flex;
            /*justify-content: center;*/
            /*align-items: center;*/
            background: #f2f2f2;
            flex-direction: column;
            display: flex;
        }

        .category-container{
            width: 450px;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            margin: 80px auto;
        }

        .category-container h2{
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        .form-group{
            margin-bottom: 15px;
        }

        label{
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input, textarea{
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            outline: none;
        }

        input:focus,
        textarea:focus{
            border-color: #007bff;
        }

        button{
            width: 100%;
            padding: 10px;
            border: none;
            background: #007bff;
            color: white;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover{
            background: #0056b3;
        }
.delete-btn button{
    background-color: #B12704;
}

    </style>
    <link rel="stylesheet" th:href="@{/css/sidebar.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
<div th:replace="/fragments/navbar:: navbar"></div>
<div class="main-div">
<div class="left-div">
<div th:replace="/fragments/sidebar::sidebar"></div>

</div>

    <div class="right">
        <div class="category-container">
        <h2>Add Category</h2>

        <form th:action="@{/category/add}" method="post">
            <div class="form-group">
                <label>Category Name</label>
                <input type="text" placeholder="Enter category name" name="categoryName" required>
            </div>


            <button type="submit">Add Category</button>
        </form>
    </div>

        <div class="categpry-table">
            <table th:each="category : ${categoryList}" style="border: 1px solid #ccc;cellpadding:10px;margin:auto;">
                <th>
                    <td>Category name</td>
                    <td>Action</td>
                </th>
                <tr>
                    <td th:text="${category.categoryName}"></td>
                    <td>
                        <button class="delete-btn" style="background-color: #B12704">Delete</button>
                    </td>
                </tr>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
