<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Add Product</title>

  <style>
    *{
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body{
      height: 500px;
      display: flex;
      /*justify-content: center;*/
      /*align-items: center;*/
      background: #f2f2f2;
      flex-direction: column;
      display: flex;
    }
    .right-div{
      margin: 30px auto;
      /*height: calc(100vh - 80px);*/
      height: 600px;
      overflow-y: auto;
      padding-bottom: 30px;
    }

    .product-container{
      width:1000px;
      background:white;
      padding:30px;
      border-radius:10px;
      box-shadow:0 4px 10px rgba(0,0,0,0.1);
    }



    .form-group{
      margin-bottom:18px;

    }

    .form-group label{
      display:block;
      margin-bottom:8px;
      font-weight:bold;
      color:#444;
    }

    .form-group input,
    .form-group textarea,
    .form-group select{
      width:100%;
      padding:10px;
      border:1px solid #ccc;
      border-radius:6px;
      font-size:15px;
    }

    .form-group textarea{
      resize:vertical;
      height:100px;
    }

    .btn{
      width:100%;
      padding:12px;
      border:none;
      background:#007bff;
      color:white;
      font-size:16px;
      border-radius:6px;
      cursor:pointer;
      transition:0.3s;
    }

    .btn:hover{
      background:#0056b3;
    }

    .image-preview{
      width:100%;
      height:220px;
      border:2px dashed #ccc;
      margin-top:10px;
      display:flex;
      justify-content:center;
      align-items:center;
      overflow:hidden;
      border-radius:8px;
    }

    .image-preview img{
      width:100%;
      height:100%;
      object-fit:cover;
    }

    .placeholder{
      color:#777;
    }

  </style>

  <link rel="stylesheet" th:href="@{/css/sidebar.css}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>
<body>

<div th:replace="/fragments/navbar::navbar"></div>
<div class="main-div">
  <div class="left-div">
    <div th:replace="/fragments/sidebar::sidebar"></div>

  </div>
  <div class="right-div">
    <div class="product-container">

      <h2 style="text-align: center">Add New Product</h2>

      <form action="/api/products" method="POST" enctype="multipart/form-data">

        <!-- Product Name -->
        <div class="form-group">
          <label>Product Name</label>
          <input type="text" name="productName" required>
        </div>

        <div class="form-group">
          <label>Tag Name</label>
          <input type="text" name="tagName" required>
        </div>


        <div class="form-group">
          <label>Product Description</label>
          <textarea name="productDescription"></textarea>
        </div>

        <div class="form-group">
          <label>Product Size</label>
          <input type="text" name="productSize" required>
        </div>

        <div class="form-group">
          <label>Product Price</label>
          <input type="number" step="0.01" name="productPrice" required>
        </div>

        <div class="form-group">
          <label>Stock Quantity</label>
          <input type="number" name="stockQuantity" required>
        </div>

        <div class="form-group">
          <label>Category</label>

          <select name="categoryId">
            <option value="">Select category</option>
            <option th:each="category:${categories}"
                    th:value="${category.categoryId}"
                    th:text="${category.categoryName}"></option>

          </select>
        </div>

        <div class="form-group">
          <label>Product Image</label>
          <input type="file" name="image" accept="image/*" id="imageInput">

          <div class="image-preview" id="previewContainer">
            <span class="placeholder">Image Preview</span>
          </div>
        </div>

        <button type="submit" class="btn">Add Product</button>

      </form>
    </div>
  </div>
</div>

<script>

  const imageInput = document.getElementById("imageInput");
  const previewContainer = document.getElementById("previewContainer");

  imageInput.addEventListener("change", function(){

    const file = this.files[0];

    if(file){

      const reader = new FileReader();

      reader.addEventListener("load", function(){

        previewContainer.innerHTML =
                `<img src="${this.result}" alt="Preview">`;

      });

      reader.readAsDataURL(file);
    }

  });

</script>

</body>
</html>
