<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Add Product</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, sans-serif;
    }

    body{
      background:#f4f6f9;
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:100vh;
    }

    .container{
      width:500px;
      background:white;
      padding:30px;
      border-radius:10px;
      box-shadow:0 4px 10px rgba(0,0,0,0.1);
    }

    .container h2{
      text-align:center;
      margin-bottom:25px;
      color:#333;
    }

    .form-group{
      margin-bottom:18px;
    }

    .form-group label{
      display:block;
      margin-bottom:8px;
      font-weight:bold;
      color:#444;
    }

    .form-group input,
    .form-group textarea,
    .form-group select{
      width:100%;
      padding:10px;
      border:1px solid #ccc;
      border-radius:6px;
      font-size:15px;
    }

    .form-group textarea{
      resize:vertical;
      height:100px;
    }

    .btn{
      width:100%;
      padding:12px;
      border:none;
      background:#007bff;
      color:white;
      font-size:16px;
      border-radius:6px;
      cursor:pointer;
      transition:0.3s;
    }

    .btn:hover{
      background:#0056b3;
    }

    .image-preview{
      width:100%;
      height:220px;
      border:2px dashed #ccc;
      margin-top:10px;
      display:flex;
      justify-content:center;
      align-items:center;
      overflow:hidden;
      border-radius:8px;
    }

    .image-preview img{
      width:100%;
      height:100%;
      object-fit:cover;
    }

    .placeholder{
      color:#777;
    }
  </style>
</head>
<body>

<div class="container">

  <h2>Add New Product</h2>

  <form action="/products/save" method="POST" enctype="multipart/form-data">

    <!-- Product Name -->
    <div class="form-group">
      <label>Product Name</label>
      <input type="text" name="productName" required>
    </div>

    <!-- Tag Name -->
    <div class="form-group">
      <label>Tag Name</label>
      <input type="text" name="tagName" required>
    </div>

    <!-- Description -->
    <div class="form-group">
      <label>Product Description</label>
      <textarea name="productDescription"></textarea>
    </div>

    <!-- Price -->
    <div class="form-group">
      <label>Product Price</label>
      <input type="number" step="0.01" name="productPrice" required>
    </div>

    <!-- Stock -->
    <div class="form-group">
      <label>Stock Quantity</label>
      <input type="number" name="stockQuantity" required>
    </div>

    <!-- Category -->
    <div class="form-group">
      <label>Category</label>

      <!-- Replace with dynamic categories -->
      <select name="categoryId">
        <option value="1">Electronics</option>
        <option value="2">Fashion</option>
        <option value="3">Books</option>
      </select>
    </div>

    <!-- Image Upload -->
    <div class="form-group">
      <label>Product Image</label>
      <input type="file" name="image" accept="image/*" id="imageInput">

      <div class="image-preview" id="previewContainer">
        <span class="placeholder">Image Preview</span>
      </div>
    </div>

    <button type="submit" class="btn">Add Product</button>

  </form>

</div>

<script>

  const imageInput = document.getElementById("imageInput");
  const previewContainer = document.getElementById("previewContainer");

  imageInput.addEventListener("change", function(){

    const file = this.files[0];

    if(file){

      const reader = new FileReader();

      reader.addEventListener("load", function(){

        previewContainer.innerHTML =
                `<img src="${this.result}" alt="Preview">`;

      });

      reader.readAsDataURL(file);
    }

  });

</script>

</body>
</html>
