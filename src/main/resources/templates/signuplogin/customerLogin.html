
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Customer Signup</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="/css/customerSignup.css">
    </head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>
<nav class="navbar navbar-expand-lg bg-body-tertiary">

<div class="signup-container" style="background-color: rgb(247, 247, 247);">
    <h2>Customer Login</h2>
    <form th:action="@{/customer/login}" method="POST">


        <input type="email" name="email" placeholder="Email" required>

        <input type="password" name="password" placeholder="Password" required>

        <button type="submit">Login </button>
    </form>
    <div th:if="${error}" th:text="${error}" style="color: red; text-align: center"> </div>
</div>
</nav>
</body>
</html>
